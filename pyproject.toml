[project]
name = "tuntun-workspace"
version = "0.1.0.dev0"
requires-python = "==3.12.*"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "live_cloud: explicit paid-provider tests",
  "reachy_hardware: explicit physical Reachy tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.uv.workspace]
members = ["apps/core", "apps/edge", "packages/contracts", "packages/testing"]

[tool.coverage.run]
branch = true
source = ["tuntun_core", "tuntun_edge", "tuntun_contracts", "tuntun_testing"]

[tool.coverage.report]
fail_under = 85
show_missing = true
