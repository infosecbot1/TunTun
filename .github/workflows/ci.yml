name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-python311:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.8.13", enable-cache: true}
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: uv python install 3.11
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: uv build --package tuntun-contracts --wheel --out-dir dist-py311
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: uv venv --python 3.11 .venv-contracts-py311
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: >-
          uv pip install --python .venv-contracts-py311/bin/python
          dist-py311/*.whl "pytest>=8.4,<9"
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: >-
          .venv-contracts-py311/bin/python -m pytest
          tests/contract/test_v1_types_and_ports.py
          tests/contract/test_dependency_direction.py -q
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Assert runner architecture
        shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: |
          case "${{ matrix.os }}" in
            ubuntu-24.04)
              expected="x86_64"
              ;;
            macos-26)
              expected="arm64"
              ;;
            macos-15-intel)
              expected="x86_64"
              ;;
            *)
              echo "unsupported runner label: ${{ matrix.os }}" >&2
              exit 1
              ;;
          esac
          actual="$(/usr/bin/uname -m)"
          if [ "$actual" != "$expected" ]; then
            echo "runner architecture mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.8.13", enable-cache: true}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with: {version: "10.15.0", run_install: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: "22", cache: pnpm}
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: uv sync --all-packages --locked
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: pnpm install --frozen-lockfile
      - shell: /bin/bash --noprofile --norc -p -euo pipefail {0}
        run: >-
          PYTEST_ADDOPTS=--basetemp=/tmp/t7-${{ github.run_id }}-${{ github.run_attempt }}
          /usr/bin/make check
