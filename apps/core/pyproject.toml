[project]
name = "tuntun-core"
version = "0.1.0.dev0"
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=45,<46",
  "fastapi>=0.141.1,<0.142",
  "keyring>=25.6,<26",
  "jsonschema>=4.25,<5",
  "platformdirs>=4.4,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "sqlcipher3==0.6.2",
  "SQLAlchemy>=2.0.43,<3",
  "structlog>=25.4,<26",
  "tuntun-contracts==0.1.0.dev0",
  "typer>=0.16,<1",
  "openai==2.54.0",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "langgraph==1.0.3",
]

[project.scripts]
tuntunctl = "tuntun_core.cli.main:app"

[project.optional-dependencies]
simulation = ["tuntun-testing"]

[tool.uv.sources]
tuntun-contracts = { workspace = true }
tuntun-testing = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "tuntun_core/_migration_assets/alembic.ini"
"migrations/env.py" = "tuntun_core/_migration_assets/migrations/env.py"
"migrations/script.py.mako" = "tuntun_core/_migration_assets/migrations/script.py.mako"
"migrations/versions/0001_foundation.py" = "tuntun_core/_migration_assets/migrations/versions/0001_foundation.py"
